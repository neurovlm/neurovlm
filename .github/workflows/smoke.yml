name: Pipeline smoke test

# Trains every model of the paper pipeline (scripts/train_pipeline.py: stages 08, 09, 20 fold 0, 11, 12, 13, 14) for one
# epoch of one batch on 64 samples, on CPU, and reports coverage of the reproduction code (.coveragerc).
# Full training takes hours on a GPU, so CI checks that the pipeline runs end to end, not its numbers.
# Inputs: the training files of scripts/hf_manifest.json, fetched from the public Hugging Face repos at their pinned
# revisions and checked against their sha256 (no token); the AAL atlas comes from nilearn.

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - ".coveragerc"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "src/**"
      - "pyproject.toml"
      - ".coveragerc"
      - ".github/workflows/smoke.yml"
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONHASHSEED: "0"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space (the training inputs take about 7 GB, twice for files copied into the data dir)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"

      - name: Environment (scripts/requirements.lock with the CPU build of torch)
        run: |
          uv venv .venv --python 3.12.12
          grep -vE '^(nvidia-|cuda-|triton==)' scripts/requirements.lock > "$RUNNER_TEMP/requirements-cpu.txt"
          uv pip install --python .venv/bin/python --torch-backend cpu -r "$RUNNER_TEMP/requirements-cpu.txt" -e ".[full,test]"
          .venv/bin/python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: Cache Hugging Face models and the AAL atlas
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub/models--*
            ~/nilearn_data/aal_SPM12
          key: smoke-inputs-${{ hashFiles('scripts/hf_manifest.json') }}

      - name: AAL atlas for stage 11 (checked by sha256)
        # www.gin.cnrs.fr does not send its intermediate certificate, so nilearn's own download fails verification
        run: |
          d="$HOME/nilearn_data/aal_SPM12"
          if [ ! -f "$d/aal/atlas/AAL.nii" ]; then
            mkdir -p "$d"
            curl -fsSL --insecure https://www.gin.cnrs.fr/AAL_files/aal_for_SPM12.tar.gz | tar -xz -C "$d"
          fi
          printf '%s  %s\n' \
            91e8ec62a293c2a28c8e7343f37abb978ab941c5e26fbc496945c66d073a2cd8 "$d/aal/atlas/AAL.nii" \
            1a0f2bb952b700fa94f5156b544cf238f2e8d0e0e5ebedaefac835938b7609f3 "$d/aal/atlas/AAL.xml" | sha256sum -c -

      - name: Training inputs from Hugging Face (pinned revisions, sha256 checked)
        run: |
          .venv/bin/python - <<'PY'
          import json, os, pathlib
          m = json.loads(pathlib.Path("scripts/hf_manifest.json").read_text())
          m["files"] = [e for e in m["files"] if any(c.startswith("train/") for c in e.get("consumers", []))]
          pathlib.Path(os.environ["RUNNER_TEMP"], "train_manifest.json").write_text(json.dumps(m, indent=1))
          print(len(m["files"]), "files,", round(sum(e["size"] for e in m["files"]) / 1e9, 1), "GB")
          PY
          .venv/bin/python scripts/data/fetch_hf.py --manifest "$RUNNER_TEMP/train_manifest.json"

      - name: Smoke training on CPU (every stage, one epoch of one batch)
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: .venv/bin/python -m coverage run scripts/train_pipeline.py --smoke --force --skip-data --no-validate --device cpu

      - name: Coverage of the reproduction code
        if: always()
        run: |
          .venv/bin/python -m coverage combine || true
          .venv/bin/python -m coverage report
          .venv/bin/python -m coverage xml -o coverage-smoke.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-smoke.xml
          flags: smoke
          fail_ci_if_error: false
