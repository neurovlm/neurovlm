[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurovlm"
version = "0.0.5"
dependencies = [
  "numpy",
  "pandas",
  "torch",
  "nibabel",
  "nilearn",
  "matplotlib",
  "huggingface-hub",
  "safetensors",
  "adapters",
  "transformers",
  "pyarrow",
  "accelerate>=1.12.0",
  "datasets>=4.8.4",
]
authors = [
  { name="Ryan Hammonds", email="ryanphammonds@gmail.com" },
]
description = "Neuroimaging vision-language models."
readme = "README.md"
requires-python = ">=3.10, <3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
metrics = [
  "nltk",
  "rouge-score",
  "scikit-learn",
  "scikit-image",
]
nct = [
  "neuromaps",
  "brainspace",
]
coords = [
  "nimare",
]
viz = [
  "matplotlib",
  "seaborn",
]
notebook = [
  "jupyter",
  "ipython",
  "tqdm",
]
llm = [
  "ollama",
  "accelerate"
]
docs = [
  "sphinx>=7.2,<9",
  "sphinx-book-theme>=1.1,<2",
  "myst-parser>=2.0,<4",
  "myst-nb>=1.1,<2",
  "sphinx-design>=0.6,<1",
  "sphinx-copybutton>=0.5,<1",
]
test = [
  "pytest>=7",
  "pytest-cov>=4",
  "pytest-xdist>=3",
]
full = [
  "nltk",
  "rouge-score",
  "scikit-learn",
  "scikit-image",
  "nimare",
  "tqdm",
  "matplotlib",
  "seaborn",
  "ipython",
  "ollama",
  "accelerate",
  "neuromaps",
  "brainspace"
]

[tool.hatch.build.targets.wheel]
# Ensure the importable package is present in the wheel, but keep it source-only.
include = ["src/neurovlm/**/*.py"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src/neurovlm/**/*.py",
  "pyproject.toml",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: isolated offline behavior",
  "integration: multi-component behavior",
  "slow: long-running tests",
  "network: requires external network access",
  "requires_data: requires downloaded datasets",
  "requires_pretrained: requires released model weights",
  "requires_specter: requires a Hugging Face SPECTER model",
]
